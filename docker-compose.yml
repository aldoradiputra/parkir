services:
  # Cloud Backend
  cloud:
    build: ./cloud
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://parkir:parkir@postgres:5432/parkir
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-parkir-dev-secret-change-in-production}
      - PORT=3001
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # Dashboard
  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
      - NEXT_PUBLIC_WS_URL=ws://localhost:3001
    depends_on:
      - cloud
    restart: unless-stopped

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=parkir
      - POSTGRES_PASSWORD=parkir
      - POSTGRES_DB=parkir
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkir"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
